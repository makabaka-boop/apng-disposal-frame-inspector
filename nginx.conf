# 以非特权用户运行：不声明 user 指令，master/worker 都继承容器 uid 101。
pid /var/run/nginx.pid;

worker_processes auto;

events {
  worker_connections 256;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  # 全部临时/缓存路径都落在可写 tmpfs，配合只读根文件系统。
  client_body_temp_path /var/cache/nginx/client_body;
  proxy_temp_path       /var/cache/nginx/proxy;
  fastcgi_temp_path     /var/cache/nginx/fastcgi;
  uwsgi_temp_path       /var/cache/nginx/uwsgi;
  scgi_temp_path        /var/cache/nginx/scgi;

  types {
    application/javascript js mjs;
    text/html html;
    text/css css;
    image/png png;
  }

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态本地检查页：禁止 fetch/WebSocket/插件/表单外发等网络能力。
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'none'; connect-src 'none'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
